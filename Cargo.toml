[package]
name = "quiclime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.8.8"
axum-client-ip = "1.1.3"
clickhouse = { version = "0.13.2", features = ["inserter", "time"] }
env_logger = "0.11.8"
eyre = "0.6.12"
governor = "0.10.4"
idna = "1.1.0"
log = "0.4.29"
parking_lot = "0.12.5"
quinn = "0.11.9"
rand = "0.9.2"
reqwest = { version = "0.12.15", default-features = false, features = ["charset", "http2", "json", "rustls-tls"] }
rustls-pki-types = "1.13.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
time = "0.3.41"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "fs", "macros", "io-util", "net"] }

[profile.release]
lto = "fat"
debug = "full"
